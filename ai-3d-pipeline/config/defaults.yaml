# Windows local default (override with BLENDER_BIN)
blender_bin: "C:/Program Files/Blender Foundation/Blender 5.2/blender.exe"
units: meters
forward: -Y
up: Z

props:
  triangle_budget: 2000
  max_materials: 3
  bevel_mm: 2
  bevel_segments: 1
  render_px: 768
  max_fix_rounds: 3

characters:
  # This PC has AMD iGPU only — TRELLIS needs NVIDIA CUDA.
  # Use demo/import here; switch to trellis when you have an NVIDIA GPU.
  generator: import  # import | triposr | trellis | hunyuan | tripo
  height_m: 1.15
  hero_triangles: 40000
  crowd_triangles: 3000
  roblox_triangles: 20000
  texture_px: 1024
  max_bones_per_vertex: 4
  fps: 30

paths:
  examples: examples
  assets: assets
  third_party: third_party

tools:
  gltf_transform: npx --yes @gltf-transform/cli
  # Optional; installed via requirements-optional.txt
  pymeshlab: true
  xatlas: true
  meshoptimizer: true

tripo:
  # Optional paid. Set TRIPO_API_KEY in the environment.
  api_base: https://api.tripo3d.ai/v2/openapi
  texture: true
  pbr: true
