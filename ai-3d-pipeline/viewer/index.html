<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 3D Pipeline Viewer</title>
  <style>
    :root { color-scheme: dark; --bg:#12141a; --panel:#1b1f2a; --fg:#e8eaef; --muted:#9aa3b2; --accent:#6cb6ff; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 ui-sans-serif, system-ui, sans-serif; }
    #ui { position:absolute; z-index:2; inset:12px auto auto 12px; width:min(360px, calc(100vw - 24px)); background:var(--panel); border:1px solid #2a3140; border-radius:10px; padding:12px; box-shadow:0 10px 40px rgba(0,0,0,.35); }
    h1 { margin:0 0 8px; font-size:15px; font-weight:650; }
    p { margin:0 0 10px; color:var(--muted); font-size:12px; }
    label { display:block; margin:8px 0 4px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
    input[type=file], select, button { width:100%; }
    select, button, input[type=text] { background:#10131a; color:var(--fg); border:1px solid #343b4d; border-radius:8px; padding:8px 10px; }
    button { cursor:pointer; background:#243044; border-color:#3a4d6a; margin-top:8px; }
    button:hover { background:#2c3b52; }
    #meta { margin-top:10px; font-size:12px; color:var(--muted); white-space:pre-wrap; }
    #c { position:fixed; inset:0; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <div id="ui">
    <h1>FBX / GLB viewer</h1>
    <p>Local fallback if Cursor’s 3D extensions haven’t reloaded yet. Drag a file or pick one below.</p>
    <label>File</label>
    <input id="file" type="file" accept=".fbx,.glb,.gltf" />
    <label>Or URL / relative path</label>
    <input id="url" type="text" placeholder="../examples/props/crate/exports/crate.glb" />
    <button id="loadUrl">Load URL</button>
    <label>Quick demos (when served from pipeline root)</label>
    <select id="demo">
      <option value="">—</option>
      <option value="../examples/props/crate/exports/crate.glb">crate.glb</option>
      <option value="../examples/props/crate/exports/crate.fbx">crate.fbx</option>
      <option value="../examples/characters/demo/exports/demo.glb">demo.glb</option>
      <option value="../examples/characters/demo/exports/demo.fbx">demo.fbx</option>
    </select>
    <div id="meta">Drop an .fbx / .glb to start.</div>
  </div>
  <canvas id="c"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    const canvas = document.getElementById('c');
    const meta = document.getElementById('meta');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x12141a);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 200);
    camera.position.set(1.8, 1.4, 2.2);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xddeeff, 0x223344, 1.1));
    const key = new THREE.DirectionalLight(0xffffff, 1.4);
    key.position.set(3, 5, 2);
    scene.add(key);
    scene.add(new THREE.GridHelper(4, 16, 0x3a4254, 0x232836));
    let root = null;
    let mixer = null;
    const clock = new THREE.Clock();

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    function clearModel() {
      if (root) {
        scene.remove(root);
        root.traverse(o => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) {
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            mats.forEach(m => m.dispose?.());
          }
        });
      }
      root = null;
      mixer = null;
    }

    function frameObject(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      obj.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z, 0.001);
      camera.position.set(maxDim * 1.4, maxDim * 1.0, maxDim * 1.6);
      controls.target.set(0, 0, 0);
      controls.update();
      return { size, tris: countTris(obj) };
    }

    function countTris(obj) {
      let n = 0;
      obj.traverse(o => {
        if (o.isMesh && o.geometry) {
          const g = o.geometry;
          const idx = g.index;
          n += idx ? idx.count / 3 : (g.attributes.position?.count || 0) / 3;
        }
      });
      return Math.round(n);
    }

    async function loadFromUrl(url, name = url) {
      clearModel();
      meta.textContent = `Loading ${name}…`;
      const lower = name.toLowerCase();
      let object;
      if (lower.endsWith('.fbx')) {
        object = await new FBXLoader().loadAsync(url);
      } else {
        const gltf = await new GLTFLoader().loadAsync(url);
        object = gltf.scene;
        if (gltf.animations?.length) {
          mixer = new THREE.AnimationMixer(object);
          mixer.clipAction(gltf.animations[0]).play();
        }
      }
      if (object.animations?.length) {
        mixer = new THREE.AnimationMixer(object);
        mixer.clipAction(object.animations[0]).play();
      }
      root = object;
      scene.add(root);
      const info = frameObject(root);
      meta.textContent = `${name}\n~${info.tris} tris\nsize ${info.size.x.toFixed(3)} × ${info.size.y.toFixed(3)} × ${info.size.z.toFixed(3)}`;
    }

    async function loadFile(file) {
      const url = URL.createObjectURL(file);
      try { await loadFromUrl(url, file.name); }
      finally { /* keep blob URL while viewing */ }
    }

    document.getElementById('file').addEventListener('change', e => {
      const f = e.target.files?.[0];
      if (f) loadFile(f);
    });
    document.getElementById('loadUrl').onclick = () => {
      const u = document.getElementById('url').value.trim();
      if (u) loadFromUrl(u);
    };
    document.getElementById('demo').onchange = e => {
      if (e.target.value) {
        document.getElementById('url').value = e.target.value;
        loadFromUrl(e.target.value);
      }
    };
    document.body.addEventListener('dragover', e => { e.preventDefault(); });
    document.body.addEventListener('drop', e => {
      e.preventDefault();
      const f = e.dataTransfer?.files?.[0];
      if (f) loadFile(f);
    });

    const params = new URLSearchParams(location.search);
    if (params.get('src')) {
      document.getElementById('url').value = params.get('src');
      loadFromUrl(params.get('src'));
    }

    (function tick() {
      requestAnimationFrame(tick);
      const dt = clock.getDelta();
      mixer?.update(dt);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
